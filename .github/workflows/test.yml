name: Test

on: 
  push:
    branches:
      - master
  schedule:
    - cron: '0 6 * * SAT'
  pull_request:
    branches:
      - master
  release:
    types: # This configuration does not affect the page_build event above
      - created

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Install latest nightly
      uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af
      with:
          toolchain: nightly
          override: true
    - name: Install latest beta
      uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af
      with:
          toolchain: beta
    - name: Build
      run: cargo build --all --verbose
    - name: Run tests stable
      run: RSTEST_TEST_CHANNEL=stable cargo test --all --verbose
    - name: Run tests beta
      run: RSTEST_TEST_CHANNEL=beta cargo test --all --verbose
    - name: Run tests nightly
      run: RSTEST_TEST_CHANNEL=nightly cargo test --all --verbose
  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: taiki-e/install-action@4083ed021ba9db65fc1082ec988b27181104c315
    - run: cargo hack check --rust-version --workspace --ignore-private
